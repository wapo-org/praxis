name: PR reviewer
on:
  push:
    branches: [main, develop]
    paths: ['infra/**', '.github/workflows/pr-reviewer.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/pr-reviewer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-reviewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: PR reviewer / pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: infra/pr-review/uv.lock
          python-version: '3.12'
      - run: uv run --project infra/pr-review --locked pytest infra/pr-review/tests -q
