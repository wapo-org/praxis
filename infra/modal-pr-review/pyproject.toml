[project]
name = "praxis-modal-pr-review"
version = "0.1.0"
description = "Modal environment hosting Meta Muse Code CLI to review GitHub PRs and test Praxis Cloud by hand"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.0.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
